name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  # The desktop shell carries the peer-to-peer transport, so it needs its own
  # job — the Node checks above never compile any Rust.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # `tauri build` refuses to run when the Rust crate and the JS API differ
      # in major.minor, and it only finds out at release time. Adding a JS
      # plugin can pull @tauri-apps/api forward on its own, so check the pair
      # here rather than discovering it in a tag build.
      - name: Check Tauri crate and JS API versions agree
        run: |
          python3 - <<'PY'
          import json, re, sys

          lock = open('src-tauri/Cargo.lock').read()
          crate = re.search(r'name = "tauri"\nversion = "([^"]+)"', lock)
          if not crate:
              sys.exit('could not find the tauri crate in src-tauri/Cargo.lock')

          packages = json.load(open('package-lock.json'))['packages']
          entry = packages.get('node_modules/@tauri-apps/api')
          if not entry:
              sys.exit('could not find @tauri-apps/api in package-lock.json')

          crate_v, js_v = crate.group(1), entry['version']
          minor = lambda v: '.'.join(v.split('.')[:2])
          print(f'tauri crate {crate_v} / @tauri-apps/api {js_v}')
          if minor(crate_v) != minor(js_v):
              sys.exit(
                  f'Tauri version mismatch: crate {crate_v} vs JS API {js_v}.\n'
                  'Align them, e.g. cargo update -p tauri --precise <version> '
                  'from src-tauri/.'
              )
          PY

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri
