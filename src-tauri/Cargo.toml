[package]
name = "atelier"
version = "0.13.0"
description = "Vector design tool for branding & logos"
authors = []
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "atelier_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-kit = "0.14"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Peer-to-peer collaboration. Rust is only a transport here: it moves opaque
# byte frames between peers and knows nothing about the CRDT, so the Yjs
# protocol lives in one place (TypeScript) rather than being reimplemented.
iroh = "1"
iroh-gossip = "0.101"
iroh-mdns-address-lookup = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
futures-lite = "2"
data-encoding = "2"
blake3 = "1"
n0-future = "0.3"
